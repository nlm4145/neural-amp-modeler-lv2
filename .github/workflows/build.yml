name: Build

on:
  [workflow_dispatch, push, pull_request]

jobs:
  build-macos:
    name: Build macOS (incl. rig UI) + dlopen check
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build Plugin
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j"$(sysctl -n hw.ncpu)"

    - name: dlopen smoke check (every .so must export lv2 descriptors)
      run: |
        set -e
        # One process per binary: the two NeuralAudio-backed .so both register
        # a global LSTM config parser; dlopening both in ONE process aborts.
        for so in build/neural_amp_modeler.lv2/*.so; do
          python3 - "$so" <<'PY'
        import ctypes, sys
        lib = ctypes.CDLL(sys.argv[1])
        if 'rig_ui' in sys.argv[1] or sys.argv[1].endswith('_ui.so'):
            getattr(lib, 'lv2ui_descriptor')
        else:
            getattr(lib, 'lv2_descriptor')
        print('   OK   ', sys.argv[1])
        PY
        done

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: neural_amp_modeler.lv2-macos
        path: ${{github.workspace}}/build/neural_amp_modeler.lv2

  build-ubuntu:
    name: Build Ubuntu
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        submodules: recursive

    - name: Setup GCC 15
      uses: egor-tensin/setup-gcc@v2
      with:
        version: '15'
    
    - name: Build Plugin
      working-directory: ${{github.workspace}}/build
      env:
        CXX: g++-15
        CXXFLAGS: "-static-libstdc++ -static-libgcc"              
      run: |
        cmake .. -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_UTILS=ON -DBUILD_INTERNAL_STATIC_WAVENET=ON -DBUILD_INTERNAL_STATIC_LSTM=ON -DBUILD_NAMCORE=ON -DBUILD_STATIC_RTNEURAL=ON 
        cmake --build . --config $BUILD_TYPE -j4
        cpack

    - name: Run ModelTest
      working-directory: ${{github.workspace}}/build/src/NeuralAudio/Utils/ModelTest
      run: ./ModelTest
      
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: neural_amp_modeler.lv2-linux-amd64
        path: ${{github.workspace}}/build/neural_amp_modeler.lv2

#    - name: Upload deb
#      uses: actions/upload-artifact@v4
#      with:
#        name: neural_amp_modeler.lv2-linux-deb-amd64
#        path: ${{github.workspace}}/build/*.deb
        
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        submodules: recursive
    
    - name: Build Plugin
      working-directory: ${{github.workspace}}/build
      run: |
        cmake.exe -G "Visual Studio 18 2026" -A x64 -DBUILD_UTILS=ON -DBUILD_INTERNAL_STATIC_WAVENET=ON -DBUILD_INTERNAL_STATIC_LSTM=ON -DBUILD_NAMCORE=ON -DBUILD_STATIC_RTNEURAL=ON -T ClangCL ..
        cmake --build . --config=release -j4

    - name: Run ModelTest
      working-directory: ${{github.workspace}}/build/src/NeuralAudio/Utils/ModelTest/Release
      run: ./ModelTest.exe
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: neural_amp_modeler.lv2-win
        path: ${{github.workspace}}/build/neural_amp_modeler.lv2
